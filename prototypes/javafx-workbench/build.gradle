plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'dev.ghidraex'
version = providers.gradleProperty('releaseVersion').orElse('0.1.0-SNAPSHOT').get()

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

javafx {
    version = '26'
    modules = ['javafx.controls']
}

application {
    mainClass = 'dev.ghidraex.fx.GhidraFxApp'
    applicationDefaultJvmArgs = ['--enable-native-access=javafx.graphics']
}

distributions {
    main {
        distributionBaseName = 'ghidraex-workbench'
        contents {
            from(rootProject.file('../../LICENSE')) {
                rename { 'LICENSE.txt' }
            }
            from(rootProject.file('../../release/WORKBENCH-README.md')) {
                rename { 'README.md' }
            }
            from(rootProject.file('../../release/legal/THIRD-PARTY-NOTICES.txt'))
            from(rootProject.file('../../release/legal/openjfx')) {
                into('legal/openjfx')
            }
        }
    }
}

dependencies {
    implementation "dev.ghidraex:ghidraex-view-state:${project.version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}
