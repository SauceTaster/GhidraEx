name: Release train

on:
  workflow_dispatch:
    inputs:
      product:
        description: Product to package for a dry run
        required: true
        default: all
        type: choice
        options:
          - all
          - workbench
          - jetbrains
          - vscode
      version:
        description: Strict SemVer (stable versions are dry-run only until product gates pass)
        required: true
        default: 0.2.0-alpha.1
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Validate release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      selection: ${{ steps.plan.outputs.selection }}
      channel: ${{ steps.plan.outputs.channel }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      publish: ${{ steps.plan.outputs.publish }}
      title: ${{ steps.plan.outputs.title }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Validate event, version, product, and matrix
        id: plan
        env:
          GHIDRAEX_RELEASE_PRODUCT: ${{ inputs.product }}
          GHIDRAEX_RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/release.py github-plan --github-output "$GITHUB_OUTPUT"

      - name: Require a release tag to come from main
        if: steps.plan.outputs.publish == 'true'
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main || {
            echo "Release tags must identify a commit reachable from origin/main." >&2
            exit 1
          }

  verify:
    name: Full repository gate
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out source without a publish credential
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            prototypes/web-workbench/package-lock.json
            prototypes/vscode-workbench/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Verify every prototype and release contract
        env:
          CI: "true"
        run: ./scripts/verify-all.sh

  real-ghidra:
    name: Real Ghidra compatibility gate
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ghidra-integration.yml

  build:
    name: Build ${{ matrix.product }} / ${{ matrix.platform }}
    needs:
      - plan
      - verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - name: Check out source without a publish credential
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Set up JDK 25
        if: matrix.product != 'vscode'
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Node.js 22
        if: matrix.product == 'vscode'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: prototypes/vscode-workbench/package-lock.json

      - name: Build and inspect the product artifact
        id: package
        shell: bash
        env:
          RELEASE_PRODUCT: ${{ matrix.product }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          python scripts/release.py build \
            --product "$RELEASE_PRODUCT" \
            --platform "$RELEASE_PLATFORM" \
            --version "$RELEASE_VERSION" \
            --output "$RUNNER_TEMP/release-assets" \
            --github-output "$GITHUB_OUTPUT"

      - name: Generate the per-artifact SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        env:
          SYFT_SOURCE_NAME: ghidraex-${{ matrix.product }}
          SYFT_SOURCE_VERSION: ${{ needs.plan.outputs.version }}
          SYFT_FILE_METADATA_SELECTION: all
        with:
          path: ${{ steps.package.outputs.sbom_scan_path }}
          format: spdx-json
          output-file: ${{ steps.package.outputs.sbom_path }}
          syft-version: v1.46.0
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Upload the isolated matrix artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ steps.package.outputs.asset_path }}
            ${{ steps.package.outputs.sbom_path }}
            ${{ steps.package.outputs.sidecar_path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  assemble:
    name: Assemble and verify release bundle
    needs:
      - plan
      - build
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source without a publish credential
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Download only this run's release matrix artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Validate the exact matrix and create checksums/manifest
        env:
          RELEASE_SELECTION: ${{ needs.plan.outputs.selection }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_PUBLISH: ${{ needs.plan.outputs.publish }}
        run: |
          publish_arg=()
          if [[ "$RELEASE_PUBLISH" == "true" ]]; then
            publish_arg+=(--publish)
          fi
          python scripts/release.py finalize \
            --assets release-assets \
            --selection "$RELEASE_SELECTION" \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --repository "$RELEASE_REPOSITORY" \
            "${publish_arg[@]}"
          python scripts/release.py verify-bundle --assets release-assets

      - name: Upload the complete unprivileged release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release-approval:
    name: Approve release publication
    needs:
      - plan
      - assemble
      - real-ghidra
    if: >-
      always() &&
      needs.plan.outputs.publish == 'true' &&
      needs.assemble.result == 'success' &&
      needs.real-ghidra.result == 'success'
    permissions:
      contents: read
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record the approved release identity
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: echo "Approved publication gates for $RELEASE_TAG ($RELEASE_VERSION)."

  attest-sbom:
    name: Attest SBOM for ${{ matrix.product }} / ${{ matrix.platform }}
    needs:
      - plan
      - assemble
      - real-ghidra
      - release-approval
    if: >-
      always() &&
      needs.plan.outputs.publish == 'true' &&
      needs.assemble.result == 'success' &&
      needs.real-ghidra.result == 'success' &&
      needs.release-approval.result == 'success'
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the fixed release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: bundle

      - name: Attest Workbench SBOM
        if: matrix.product == 'workbench'
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: bundle/ghidraex-workbench-${{ needs.plan.outputs.version }}-${{ matrix.platform }}.zip
          sbom-path: bundle/ghidraex-workbench-${{ needs.plan.outputs.version }}-${{ matrix.platform }}.zip.spdx.json

      - name: Attest JetBrains SBOM
        if: matrix.product == 'jetbrains'
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: bundle/ghidraex-jetbrains-${{ needs.plan.outputs.version }}.zip
          sbom-path: bundle/ghidraex-jetbrains-${{ needs.plan.outputs.version }}.zip.spdx.json

      - name: Attest VS Code SBOM
        if: matrix.product == 'vscode'
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: bundle/ghidraex-vscode-${{ needs.plan.outputs.version }}.vsix
          sbom-path: bundle/ghidraex-vscode-${{ needs.plan.outputs.version }}.vsix.spdx.json

  attest-provenance:
    name: Attest release provenance
    needs:
      - plan
      - assemble
      - real-ghidra
      - release-approval
    if: >-
      always() &&
      needs.plan.outputs.publish == 'true' &&
      needs.assemble.result == 'success' &&
      needs.real-ghidra.result == 'success' &&
      needs.release-approval.result == 'success'
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the fixed release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: bundle

      - name: Generate build provenance for the complete bundle
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: bundle/*

  draft-release:
    name: Create immutable-ready draft release
    needs:
      - plan
      - assemble
      - real-ghidra
      - release-approval
      - attest-sbom
      - attest-provenance
    if: >-
      always() &&
      needs.plan.outputs.publish == 'true' &&
      needs.assemble.result == 'success' &&
      needs.real-ghidra.result == 'success' &&
      needs.release-approval.result == 'success' &&
      needs.attest-sbom.result == 'success' &&
      needs.attest-provenance.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the fixed release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: bundle

      - name: Verify checksums and create a new draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_TITLE: ${{ needs.plan.outputs.title }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          cd bundle
          sha256sum --check SHA256SUMS
          cd ..

          if gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            echo "A release already exists for $RELEASE_TAG; refusing to replace its assets." >&2
            exit 1
          fi

          assets=(
            "bundle/ghidraex-workbench-$RELEASE_VERSION-linux-x64.zip"
            "bundle/ghidraex-workbench-$RELEASE_VERSION-linux-x64.zip.spdx.json"
            "bundle/ghidraex-workbench-$RELEASE_VERSION-linux-arm64.zip"
            "bundle/ghidraex-workbench-$RELEASE_VERSION-linux-arm64.zip.spdx.json"
            "bundle/ghidraex-workbench-$RELEASE_VERSION-windows-x64.zip"
            "bundle/ghidraex-workbench-$RELEASE_VERSION-windows-x64.zip.spdx.json"
            "bundle/ghidraex-workbench-$RELEASE_VERSION-macos-x64.zip"
            "bundle/ghidraex-workbench-$RELEASE_VERSION-macos-x64.zip.spdx.json"
            "bundle/ghidraex-workbench-$RELEASE_VERSION-macos-arm64.zip"
            "bundle/ghidraex-workbench-$RELEASE_VERSION-macos-arm64.zip.spdx.json"
            "bundle/ghidraex-jetbrains-$RELEASE_VERSION.zip"
            "bundle/ghidraex-jetbrains-$RELEASE_VERSION.zip.spdx.json"
            "bundle/ghidraex-vscode-$RELEASE_VERSION.vsix"
            "bundle/ghidraex-vscode-$RELEASE_VERSION.vsix.spdx.json"
            "bundle/release-manifest.json"
            "bundle/SHA256SUMS"
          )
          for asset in "${assets[@]}"; do
            test -f "$asset" || { echo "Missing fixed release asset: $asset" >&2; exit 1; }
          done

          args=(
            "$RELEASE_TAG"
            "${assets[@]}"
            --repo "$RELEASE_REPOSITORY"
            --verify-tag
            --draft
            --title "$RELEASE_TITLE"
            --generate-notes
            --notes "Developer preview: the three native clients use deterministic fixture adapters. Ghidra is not bundled. Verify capability truth and compatibility in release-manifest.json."
          )
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
