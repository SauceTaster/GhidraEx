name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            prototypes/web-workbench/package-lock.json
            prototypes/vscode-workbench/package-lock.json

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Verify all prototypes
        run: ./scripts/verify-all.sh
